  /* v68 theme: every surface and text colour checked for readability (WCAG AA) in both themes.
     The accent / status colours below are only the starting values: the app tunes them to the
     accent and tone chosen in Settings (llqaApplyTheme). */

    --bg: #f3f5f9;
    --bgCard: rgba(255, 255, 255, 0.95);
    --bgDeep: rgba(238, 242, 247, 0.8);

    --borderLight: rgba(15, 23, 42, 0.06);
    --text: #0f172a;
    --textSec: #334155;
    --textMuted: #475569;
    --accent: #2a53d5;
    --accentRaw: #4a7aff;
    --accentFill: #3b68ec;
    --accentText: #ffffff;
    --accentBorder: #3b68ec;
    --accentBg: rgba(42, 83, 213, 0.1);
    --booked: var(--accent);
    --bookedBg: var(--accentBg);
    --accentRing: rgba(42, 83, 213, 0.32);
    --success: #026e4b;
    --successBg: rgba(2, 110, 75, 0.1);
    --successFill: #04835a;
    --successText: #ffffff;
    --warn: #885501;
    --warnBg: rgba(136, 85, 1, 0.1);
    --warnFill: #f59e0b;
    --warnText: #0b0d14;
    --danger: #b80f1f;
    --dangerBg: rgba(184, 15, 31, 0.1);
    --dangerFill: #da2c32;
    --dangerText: #ffffff;
    --purple: #6a35cf;
    --purpleBg: rgba(106, 53, 207, 0.1);
    --purpleFill: #8352ec;
    --purpleText: #ffffff;
    --cyan: #0e697b;
    --cyanBg: rgba(14, 105, 123, 0.1);
    --cyanFill: #127d92;
    --cyanText: #ffffff;
    --gradientPrimary: linear-gradient(180deg, #4f7af7 0%, #2f5ddf 100%);
    --glowPrimary: inset 0 1px 0 rgba(255,255,255,0.22), 0 6px 18px -8px rgba(59,104,236,0.55);
    --shadow3d: 0 1px 2px rgba(15,23,42,0.05), 0 8px 24px -12px rgba(15,23,42,0.16), inset 0 1px 0 rgba(255,255,255,0.9);
    --glowA: rgba(42, 83, 213, 0.08);
    --glowB: rgba(106, 53, 207, 0.06);
    --inputBorder: rgba(15, 23, 42, 0.2);
    --inputShadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
    --scrollThumb: rgba(15, 23, 42, 0.24);
    --liftShadow: 0 14px 30px -14px rgba(15, 23, 42, 0.32);
    color-scheme: light;
  }

  [data-theme='dark'] {
    --bg: #09090b;
    --bgCard: rgba(24, 24, 27, 0.62);
    --bgDeep: rgba(9, 9, 11, 0.72);
    --bgHover: rgba(255, 255, 255, 0.045);

    --accentBg: rgba(115, 155, 253, 0.16);

    --bookedBg: var(--accentBg);
    --accentRing: rgba(115, 155, 253, 0.4);

    --purpleBg: rgba(172, 144, 255, 0.16);

    --cyanBg: rgba(34, 211, 238, 0.16);
    --gradientPrimary: linear-gradient(180deg, #4f7af7 0%, #2f5ddf 100%);

    --shadow3d: 0 10px 28px -14px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.06);
    --glowA: rgba(115, 155, 253, 0.13);
    --glowB: rgba(172, 144, 255, 0.09);
    --inputBorder: rgba(255, 255, 255, 0.13);
    --inputShadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    --scrollThumb: rgba(255, 255, 255, 0.17);
    --liftShadow: 0 14px 30px -14px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }

  * {
    transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  /* page: theme colour with a soft glow of the accent in the corners */
  html {
    background: var(--bg) !important;
    scrollbar-color: var(--scrollThumb) transparent;
    accent-color: var(--accentFill);
  }
  html, body { color: var(--text); }
  body {
    background:
      radial-gradient(1100px 620px at -8% -12%, var(--glowA), transparent 62%),
      radial-gradient(900px 560px at 108% -6%, var(--glowB), transparent 60%),
      var(--bg) !important;
    background-attachment: fixed !important;
  }
  ::selection { background: var(--accentRing); }

  .hover-lift {
    transition: transform 0.15s ease-out, box-shadow 0.15s ease-out, filter 0.15s ease-out !important;
  }
  .hover-lift:hover {
    transform: translateY(-1px);
    box-shadow: var(--liftShadow), inset 0 1px 0 rgba(255,255,255,0.08) !important;
    filter: brightness(1.04);
  }

  /* scrollbars that show in both themes */
  ::-webkit-scrollbar-thumb {
    background: var(--scrollThumb) !important;
    border-radius: 8px;
    border: 2px solid transparent !important;
    background-clip: padding-box !important;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--textMuted) !important; background-clip: padding-box !important; }
  ::-webkit-scrollbar-track { background: transparent !important; }

  /* inputs: a visible edge and a clear focus ring in both themes */
  input, select, textarea {
    box-shadow: var(--inputShadow) !important;
    transition: border-color 0.15s, box-shadow 0.15s !important;
    border: 1px solid var(--inputBorder) !important;
  }
  input:focus, select:focus, textarea:focus {
    box-shadow: var(--inputShadow), 0 0 0 3px var(--accentRing) !important;
    border-color: var(--accent) !important;
    outline: none !important;
  }
  input::placeholder, textarea::placeholder { color: var(--textMuted); opacity: 1; }
  /* v70: a field drawn inside its own framed box (a search box with an icon) keeps one frame, not two;
     the frame lights up while you type in it */
  [style*="border: 1px solid"] > input[style*="border: none"], [style*="border: 1px solid"] > textarea[style*="border: none"] {
    border: none !important; box-shadow: none !important; background: transparent !important;
  }
  [style*="border: 1px solid"]:has(> input[style*="border: none"]:focus) {
    border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accentRing) !important;
  }
  button:focus-visible, a:focus-visible, [role="button"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Dashboard panels stack on narrow screens */
  @media (max-width: 900px) {
    .llqa-dash-grid { grid-template-columns: 1fr !important; }
  }

  /* v70: an empty table's message row shows only while it is the table's only row */
  tr.llqa-empty-row:not(:only-child), .llqa-empty-note:not(:only-child) { display: none !important; }

  /* v69: typography — Inter, with the computer's own font as the fallback */
  :root {
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body {
    font-family: var(--font) !important;
    font-feature-settings: "cv11", "ss01";
    text-rendering: optimizeLegibility;
  }
  td, th { font-variant-numeric: tabular-nums; }

  /* v69: background tones (Settings > Appearance > Background). Every text and status
     colour is checked against these surfaces too (llqaAccentSet / LLQA_THEME.surfaces). */
  [data-theme='dark'][data-backdrop='midnight'] {
    --bg: #070b14;
    --bgCard: rgba(17, 24, 39, 0.62);
    --bgDeep: rgba(7, 11, 20, 0.72);
    --bgHover: rgba(148, 163, 184, 0.06);
    --bgInput: rgba(2, 6, 23, 0.35);
    --border: rgba(148, 163, 184, 0.14);
    --borderLight: rgba(148, 163, 184, 0.07);
    --text: #f1f5f9;
    --textSec: #a3b0c2;
    --textMuted: #8794aa;
    --inputBorder: rgba(148, 163, 184, 0.22);
    --scrollThumb: rgba(148, 163, 184, 0.24);
  }
  [data-theme='dark'][data-backdrop='warm'] {
    --bg: #0c0a09;
    --bgCard: rgba(28, 25, 23, 0.62);
    --bgDeep: rgba(12, 10, 9, 0.72);
    --bgHover: rgba(250, 250, 249, 0.045);

    --border: rgba(15, 23, 42, 0.11);

    --bg: #f5f2ec;
    --bgDeep: rgba(238, 233, 225, 0.8);
    --bgHover: rgba(28, 25, 23, 0.04);
    --border: rgba(28, 25, 23, 0.1);

    --text: #1c1917;
    --textSec: #3f3a36;
    --textMuted: #57514c;
    --inputBorder: rgba(28, 25, 23, 0.2);
  }
