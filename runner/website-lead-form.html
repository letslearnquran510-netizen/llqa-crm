<!--
  LLQA — free trial inquiry form for letslearnquran.net.
  Each inquiry goes to the CRM runner and appears in CRM → Sales → 🎯 Leads
  (due today), with a notice for the admin. Change LLQA_LEAD_URL to your
  runner's address. The chat widget can send inquiries the same way:
    window.llqaSendLead({ parent, name, phone, country, state, message, source: "Chat" })
-->
<form id="llqa-lead-form" style="max-width:420px;display:grid;gap:8px;font-family:inherit">
  <input name="parent" placeholder="Parent / guardian name" required autocomplete="name">
  <input name="name" placeholder="Student name">
  <input name="phone" placeholder="WhatsApp number with country code, e.g. +1 555 010 1234" required autocomplete="tel" inputmode="tel">
  <select name="country">
    <option>USA</option><option>Canada</option><option>UK</option><option>Australia</option><option>UAE</option><option>Other</option>
  </select>
  <input name="state" placeholder="State / province / city">
  <select name="course"><option value="Quran">Quran</option><option value="Subject">School subjects</option></select>
  <textarea name="message" rows="3" placeholder="Preferred days and times, questions…"></textarea>
  <!-- left empty by people; robots fill it in -->
  <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
  <button type="submit">Book a free trial</button>
  <p id="llqa-lead-msg" role="status" style="margin:0;font-size:14px"></p>
</form>
<script>
(function () {
  var LLQA_LEAD_URL = "https://crm-api.letslearnquran.net/lead";
  window.llqaSendLead = function (data) {
    return fetch(LLQA_LEAD_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "Please try again."); return j; }); });
  };
  var f = document.getElementById("llqa-lead-form");
  if (!f) return;
  var msg = document.getElementById("llqa-lead-msg");
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var d = {}; new FormData(f).forEach(function (v, k) { d[k] = String(v).trim(); });
    d.source = "Website";
    var b = f.querySelector("button"); b.disabled = true; msg.textContent = "Sending…";
    window.llqaSendLead(d).then(function () {
      msg.textContent = "Thank you! We'll message you on WhatsApp shortly to book the free trial.";
      f.reset();
    }).catch(function (err) {
      msg.textContent = err.message || "Something went wrong — please message us on WhatsApp.";
    }).then(function () { b.disabled = false; });
  });
})();
</script>
